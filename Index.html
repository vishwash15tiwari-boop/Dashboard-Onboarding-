<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onboarding Operations Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #212121; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    .app-header { background: #1a237e; color: #fff; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 52px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.3); z-index: 50; }
    .app-header h1 { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    #updated-time { font-size: 10px; opacity: .7; }
    .refresh-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .refresh-btn:hover { background: rgba(255,255,255,.25); }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Layout */
    .body-layout { display: flex; flex: 1; overflow: hidden; }
    .main { flex: 1; overflow-y: auto; padding: 20px; }

    /* Sidebar */
    .sidebar { width: 210px; background: #0d1b6b; flex-shrink: 0; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-user { padding: 12px 12px 8px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .sidebar-user label { font-size: 9px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 4px; }
    .sidebar-user select { width: 100%; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-family: inherit; cursor: pointer; }
    .sidebar-user select option { background: #1a237e; }
    .nav-sec { padding: 10px 12px 3px; font-size: 9px; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: .7px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 12px; color: rgba(255,255,255,.72); cursor: pointer; border-left: 3px solid transparent; transition: background .12s; }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,.12); color: #fff; border-left-color: #82b1ff; font-weight: 600; }
    .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .sidebar-foot { padding: 10px 12px; font-size: 9px; color: rgba(255,255,255,.28); border-top: 1px solid rgba(255,255,255,.08); margin-top: auto; }

    /* States */
    .state-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 10px; color: #546e7a; font-size: 13px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1a237e; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; border-radius: 8px; padding: 12px 16px; font-size: 12px; margin-bottom: 14px; }

    /* Sections */
    .section { margin-bottom: 20px; }
    .section-title { background: #37474f; color: #fff; padding: 7px 14px; font-size: 11px; font-weight: 700; border-radius: 6px 6px 0 0; letter-spacing: .4px; display: flex; align-items: center; justify-content: space-between; }
    .st-right { font-size: 10px; font-weight: 400; opacity: .8; display: flex; gap: 8px; align-items: center; }
    .btn-add { background: #82b1ff; color: #1a237e; border: none; padding: 3px 10px; border-radius: 3px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .btn-add:hover { background: #b3cfff; }

    /* KPI grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); border-radius: 0 0 8px 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .kpi-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 8px 12px; border-right: 1px solid rgba(255,255,255,.15); }
    .kpi-card:last-child { border-right: none; }
    .kpi-label { font-size: 9px; font-weight: 600; text-align: center; opacity: .85; text-transform: uppercase; letter-spacing: .3px; line-height: 1.4; }
    .kpi-value { font-size: 28px; font-weight: 700; line-height: 1.1; margin-top: 4px; }

    /* Summary cards */
    .sum-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .sum-card { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .sum-val { font-size: 24px; font-weight: 700; }
    .sum-lbl { font-size: 10px; color: #546e7a; font-weight: 500; text-transform: uppercase; letter-spacing: .3px; margin-top: 2px; }

    /* Tables */
    .table-wrap { background: #fff; border-radius: 0 0 8px 8px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { background: #eceff1; color: #37474f; padding: 7px 10px; text-align: center; font-weight: 700; font-size: 10px; border-bottom: 2px solid #b0bec5; white-space: nowrap; text-transform: uppercase; letter-spacing: .3px; }
    th:first-child { text-align: left; }
    td { padding: 7px 10px; text-align: center; border-bottom: 1px solid #f5f5f5; color: #424242; white-space: nowrap; }
    td:first-child { text-align: left; font-weight: 600; color: #1a237e; }
    tr:last-child td { border-bottom: none; }
    tr.total-row td { background: #1a237e; color: #fff; font-weight: 700; }
    tr.total-row td:first-child { color: #fff; }
    tr.click-row { cursor: pointer; }
    tr.click-row:hover td { background: #e8eaf6; }
    tr:not(.total-row):not(.click-row):hover td { background: #fafafa; }
    .td-act { white-space: nowrap; }
    .btn-edit { background: none; border: 1px solid #b0bec5; color: #546e7a; padding: 2px 8px; border-radius: 3px; font-size: 10px; cursor: pointer; }
    .btn-edit:hover { border-color: #1a237e; color: #1a237e; }

    /* Filters */
    .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .filter-lbl { font-size: 10px; color: #546e7a; font-weight: 600; }
    .filter-sel { background: #fff; border: 1px solid #cfd8dc; border-radius: 4px; padding: 4px 8px; font-size: 11px; font-family: inherit; color: #212121; cursor: pointer; }

    /* Badges */
    .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .b-green  { background: #e8f5e9; color: #1b5e20; }
    .b-red    { background: #ffebee; color: #b71c1c; }
    .b-orange { background: #fff3e0; color: #e65100; }
    .b-blue   { background: #e3f2fd; color: #0277bd; }
    .b-gray   { background: #eceff1; color: #546e7a; }
    .b-purple { background: #f3e5f5; color: #4a148c; }

    /* Progress bar */
    .prog-wrap { background: #e0e0e0; border-radius: 8px; height: 6px; width: 64px; display: inline-block; vertical-align: middle; }
    .prog-fill { height: 100%; border-radius: 8px; background: #1a237e; }

    /* Case 360 */
    .back-link { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; color: #1a237e; font-weight: 600; margin-bottom: 14px; }
    .back-link:hover { text-decoration: underline; }
    .case-hero { background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 14px; }
    .case-title { font-size: 16px; font-weight: 700; color: #1a237e; }
    .case-sub { font-size: 11px; color: #546e7a; margin-top: 3px; }
    .case-chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .case-tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 14px; }
    .case-tab { padding: 8px 18px; font-size: 12px; font-weight: 600; cursor: pointer; color: #546e7a; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .case-tab.active { color: #1a237e; border-bottom-color: #1a237e; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .detail-cell { background: #fff; border-radius: 6px; padding: 10px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .dc-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: #546e7a; font-weight: 600; }
    .dc-val { font-size: 13px; font-weight: 600; color: #212121; margin-top: 3px; }
    .workflow-step { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 6px; padding: 10px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 8px; }
    .ws-label { flex: 1; font-size: 12px; font-weight: 600; }
    .ws-date { font-size: 11px; color: #546e7a; }

    /* Alerts */
    .alerts-grid { background: #fff; border-radius: 0 0 8px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .alert-row { display: flex; align-items: center; padding: 10px 16px; gap: 12px; border-bottom: 1px solid rgba(0,0,0,.04); font-size: 12px; font-weight: 600; }
    .alert-row:last-child { border-bottom: none; }
    .alert-count { font-size: 20px; font-weight: 700; min-width: 40px; text-align: center; }

    /* Performance */
    .perf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .perf-card { background: #fff; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .perf-val { font-size: 22px; font-weight: 700; color: #1a237e; }
    .perf-lbl { font-size: 10px; color: #546e7a; text-transform: uppercase; letter-spacing: .3px; margin-top: 2px; }

    /* Settings */
    .set-card { background: #fff; border-radius: 8px; padding: 14px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
    .set-card h3 { font-size: 11px; font-weight: 700; color: #1a237e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .4px; }
    .set-row { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid #f5f5f5; font-size: 11px; }
    .set-row:last-child { border-bottom: none; }
    .set-key { font-weight: 600; width: 200px; flex-shrink: 0; color: #546e7a; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 8px; padding: 20px; width: min(640px, 96vw); max-height: 90vh; overflow-y: auto; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-head h3 { font-size: 13px; font-weight: 700; color: #1a237e; }
    .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #546e7a; line-height: 1; }
    .modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 12px; border-top: 1px solid #e0e0e0; }
    .btn-cancel { padding: 7px 16px; border: 1px solid #cfd8dc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 11px; font-family: inherit; }
    .btn-save { padding: 7px 16px; border: none; border-radius: 4px; background: #1a237e; color: #fff; cursor: pointer; font-size: 11px; font-weight: 600; font-family: inherit; }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .form-grid .span2 { grid-column: span 2; }
    .form-row { display: flex; flex-direction: column; gap: 3px; }
    .form-label { font-size: 10px; font-weight: 600; color: #546e7a; text-transform: uppercase; letter-spacing: .3px; }
    .form-inp { width: 100%; border: 1px solid #cfd8dc; border-radius: 4px; padding: 6px 8px; font-size: 12px; font-family: inherit; color: #212121; background: #fff; }
    .form-inp:focus { outline: none; border-color: #1a237e; box-shadow: 0 0 0 2px rgba(26,35,126,.15); }
    textarea.form-inp { resize: vertical; }
    .owner-badge { background: #e8eaf6; color: #1a237e; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }

    .footer { text-align: center; font-size: 10px; color: #90a4ae; padding: 16px 0 4px; }

    @media (max-width: 900px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .sum-cards, .perf-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .sidebar { display: none; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .span2 { grid-column: span 1; }
    }
  </style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen" style="position:fixed;inset:0;background:#1a237e;display:flex;align-items:center;justify-content:center;z-index:999;">
  <div style="background:#fff;border-radius:12px;padding:32px 36px;width:min(380px,94vw);box-shadow:0 8px 32px rgba(0,0,0,.3);">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:28px;margin-bottom:8px;">&#9881;</div>
      <h2 style="font-size:15px;font-weight:700;color:#1a237e;margin-bottom:4px;">Onboarding Operations Platform</h2>
      <p style="font-size:11px;color:#546e7a;">Sign in with your Recykal email</p>
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:10px;font-weight:600;color:#546e7a;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px;">Email</label>
      <input id="login-email" type="email" placeholder="you@recykal.com" style="width:100%;border:1px solid #cfd8dc;border-radius:4px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none;" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    </div>
    <div style="margin-bottom:6px;">
      <label style="font-size:10px;font-weight:600;color:#546e7a;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px;">Password</label>
      <input id="login-pass" type="password" placeholder="••••••••" style="width:100%;border:1px solid #cfd8dc;border-radius:4px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none;" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="color:#b71c1c;font-size:11px;margin:8px 0;min-height:16px;"></div>
    <button id="login-btn" onclick="doLogin()" style="width:100%;background:#1a237e;color:#fff;border:none;border-radius:4px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Sign In</button>
  </div>
</div>

<header class="app-header">
  <h1>&#9881; ONBOARDING OPERATIONS PLATFORM</h1>
  <div class="header-right">
    <span id="header-user" style="font-size:11px;opacity:.75;"></span>
    <span id="updated-time"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="onRefresh()">&#8635; Refresh</button>
    <button class="refresh-btn" id="logout-btn" onclick="doLogout()" style="background:rgba(255,80,80,.25);border-color:rgba(255,120,120,.4);">&#x23FB; Logout</button>
  </div>
</header>

<div class="body-layout">
  <nav class="sidebar">
    <div class="sidebar-user">
      <label>Viewing as</label>
      <select id="user-sel" onchange="onUserChange()">
        <option value="__manager__">Ajay (Manager)</option>
        <option value="Harshita">Harshita</option>
        <option value="Vamsi">Vamsi</option>
        <option value="Naveen">Naveen</option>
        <option value="Vishwash">Vishwash</option>
      </select>
    </div>
    <div class="nav-sec">Overview</div>
    <div class="nav-item nav-admin" data-v="dashboard"   onclick="navigate('dashboard')">  <span class="nav-icon">&#128202;</span> Control Tower</div>
    <div class="nav-item"          data-v="workspace"   onclick="navigate('workspace')">  <span class="nav-icon">&#128101;</span> My Workspace</div>
    <div class="nav-sec">Operations</div>
    <div class="nav-item"          data-v="cases"       onclick="navigate('cases')">      <span class="nav-icon">&#128203;</span> OB Cases</div>
    <div class="nav-item"          data-v="monitoring"  onclick="navigate('monitoring')"> <span class="nav-icon">&#128065;</span> Monitoring</div>
    <div class="nav-item"          data-v="thirdparty"  onclick="navigate('thirdparty')"> <span class="nav-icon">&#129309;</span> Third Party</div>
    <div class="nav-item"          data-v="projects"    onclick="navigate('projects')">   <span class="nav-icon">&#128196;</span> Projects</div>
    <div class="nav-sec">Insights</div>
    <div class="nav-item"          data-v="performance" onclick="navigate('performance')"><span class="nav-icon">&#128200;</span> Performance</div>
    <div class="nav-sec nav-admin">Admin</div>
    <div class="nav-item nav-admin" data-v="settings"   onclick="navigate('settings')">  <span class="nav-icon">&#9881;</span> Settings</div>
    <div class="sidebar-foot">Auto-refresh: 60 s</div>
  </nav>

  <main class="main" id="main"></main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">&#215;</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save"   id="modal-save" onclick="runSave()">Save</button>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────
var MEMBERS   = ['Harshita','Vamsi','Naveen','Vishwash'];
var VERTICALS = ['Marketplace','Open Marketplace','EPR & Sustainability'];
var YN        = ['','Y','N'];

// ── State ─────────────────────────────────────────────────
var state = {
  view:        'dashboard',
  user:        '__manager__',
  currentUser: null,
  c360:        null,
  tab360:      'overview',
  filters: {
    cases:      {owner:'',vertical:'',status:''},
    monitoring: {owner:'',status:''},
    thirdparty: {owner:'',status:''},
    projects:   {owner:'',status:''}
  },
  data: {}
};
var pendingSave = null;
var autoTimer   = null;

// ── Auth ──────────────────────────────────────────────────
function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var pass  = document.getElementById('login-pass').value.trim();
  var err   = document.getElementById('login-err');
  var btn   = document.getElementById('login-btn');
  if (!email || !pass) { err.textContent = 'Email and password are required.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';

  // Safety timeout — reset button if GAS never responds
  var loginTimer = setTimeout(function() {
    btn.disabled = false; btn.textContent = 'Sign In';
    err.textContent = 'No response from server. Ensure all GAS files are saved, then retry.';
  }, 25000);

  google.script.run
    .withSuccessHandler(function(u) {
      clearTimeout(loginTimer);
      btn.disabled = false; btn.textContent = 'Sign In';
      if (!u || !u.success) {
        err.textContent = u && u.error ? 'Server error: ' + u.error : 'Invalid email or password.';
        return;
      }
      state.currentUser = u;
      document.getElementById('login-screen').style.display = 'none';
      _setupForUser(u);
    })
    .withFailureHandler(function(e) {
      clearTimeout(loginTimer);
      btn.disabled = false; btn.textContent = 'Sign In';
      var msg = (e && (e.message || String(e))) || 'Login failed.';
      err.textContent = msg.indexOf('not found') > -1
        ? 'Server function missing — copy WebApp.gs to your GAS project and save.'
        : msg;
    })
    .verifyLogin(email, pass);
}

function doLogout() {
  state.currentUser = null;
  document.getElementById('header-user').textContent = '';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').textContent = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').focus();
}

function _setupForUser(u) {
  var isAdmin = u.role === 'admin';
  document.getElementById('header-user').textContent = u.name + (isAdmin ? ' (Admin)' : '');
  // Show/hide admin-only nav elements
  document.querySelectorAll('.nav-admin').forEach(function(el) {
    el.style.display = isAdmin ? '' : 'none';
  });
  // Lock user selector for members
  var sel = document.getElementById('user-sel');
  if (!isAdmin) {
    sel.innerHTML = '<option value="' + u.sheet + '">' + u.name + '</option>';
    sel.disabled = true;
    state.user = u.sheet;
  } else {
    state.user = '__manager__';
    sel.disabled = false;
  }
  navigate(isAdmin ? 'dashboard' : 'workspace');
}

// ── Utilities ─────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(v) { return (v!==undefined&&v!==null&&v!=='') ? v : '—'; }
function pct(v) { return typeof v==='number' ? Math.round(v*100)+'%' : (v||'—'); }
function gv(id) { var e=document.getElementById(id); return e ? e.value.trim() : ''; }

function badge(v) {
  var s = String(v||'');
  if (!s||s==='—') return '<span class="badge b-gray">—</span>';
  if (s==='Completed')    return '<span class="badge b-green">'+esc(s)+'</span>';
  if (s==='Rejected')     return '<span class="badge b-gray">'+esc(s)+'</span>';
  if (s==='In Progress')  return '<span class="badge b-blue">'+esc(s)+'</span>';
  if (s==='Docs Pending'||s==='Pending Docs') return '<span class="badge b-orange">'+esc(s)+'</span>';
  if (s==='Not Started')  return '<span class="badge b-gray">'+esc(s)+'</span>';
  if (s==='Open')         return '<span class="badge b-orange">'+esc(s)+'</span>';
  if (s==='Done'||s==='Closed') return '<span class="badge b-green">'+esc(s)+'</span>';
  if (s==='Overdue')      return '<span class="badge b-red">'+esc(s)+'</span>';
  if (s==='Started')      return '<span class="badge b-blue">'+esc(s)+'</span>';
  if (s==='⚠ Breach')    return '<span class="badge b-red">'+esc(s)+'</span>';
  if (s==='On Track')     return '<span class="badge b-green">'+esc(s)+'</span>';
  if (s==='Report Received'||s==='Bill Received') return '<span class="badge b-purple">'+esc(s)+'</span>';
  return '<span class="badge b-gray">'+esc(s)+'</span>';
}

function progBar(v) {
  var p = typeof v==='number' ? Math.min(100,Math.round(v*100)) : 0;
  return '<div class="prog-wrap"><div class="prog-fill" style="width:'+p+'%"></div></div><span style="font-size:10px;margin-left:4px;">'+p+'%</span>';
}

var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function toInputDate(s) {
  if (!s||s==='—') return '';
  var m = String(s).match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if (!m) return '';
  var mo = MONTHS[m[2]]; if (mo===undefined) return '';
  return m[3]+'-'+('0'+(mo+1)).slice(-2)+'-'+('0'+m[1]).slice(-2);
}

function setMain(html) { document.getElementById('main').innerHTML = html; }
function setUpdated() { document.getElementById('updated-time').textContent = 'Updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }

// ── Navigation ────────────────────────────────────────────
function navigate(viewId) {
  // Block restricted views for members
  if (state.currentUser && state.currentUser.role !== 'admin') {
    if (viewId === 'dashboard' || viewId === 'settings') viewId = 'workspace';
  }
  state.view = viewId;
  document.querySelectorAll('.nav-item').forEach(function(el) {
    var v = el.dataset.v;
    el.classList.toggle('active', v===viewId||(viewId==='case360'&&v==='cases'));
  });
  clearTimeout(autoTimer);
  loadView(viewId);
}

function onUserChange() {
  state.user = document.getElementById('user-sel').value;
  state.data = {};
  loadView(state.view);
}

function onRefresh() { state.data = {}; loadView(state.view); }

function goWorkspace(name) {
  document.getElementById('user-sel').value = name;
  state.user = name;
  state.data = {};
  navigate('workspace');
}

// ── Data loading ──────────────────────────────────────────
function cKey(v) {
  if (v==='workspace') return 'ws_'+state.user;
  if (v==='case360')   return 'c360_'+(state.c360?state.c360.owner+'_'+state.c360.row:'x');
  return v;
}

function loadView(viewId) {
  var btn = document.getElementById('refresh-btn');
  btn.disabled=true; btn.textContent='Loading…';
  var k = cKey(viewId);
  if (state.data[k]) {
    btn.disabled=false; btn.textContent='↻ Refresh';
    renderView(viewId,state.data[k]); return;
  }
  setMain('<div class="state-center"><div class="spinner"></div><span>Loading&hellip;</span></div>');
  function ok(d) {
    btn.disabled=false; btn.textContent='↻ Refresh';
    state.data[k]=d; setUpdated(); renderView(viewId,d);
    clearTimeout(autoTimer);
    autoTimer=setTimeout(function(){state.data[k]=null;if(state.view===viewId)loadView(viewId);},60000);
  }
  function fail(e) {
    btn.disabled=false; btn.textContent='↻ Refresh';
    setMain('<div class="error-box">&#9888; '+esc(e.message||String(e))+'</div>');
  }
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
  if      (viewId==='dashboard')   r.getDashboardData();
  else if (viewId==='workspace')   r.getWorkspaceData(state.user==='__manager__'?'Harshita':state.user);
  else if (viewId==='cases')       r.getCasesListData();
  else if (viewId==='case360')     r.getCase360Data(state.c360.owner,state.c360.row);
  else if (viewId==='monitoring')  r.getMonitoringListData();
  else if (viewId==='thirdparty')  r.getThirdPartyListData();
  else if (viewId==='projects')    r.getProjectsData();
  else if (viewId==='performance') r.getPerformanceData();
  else if (viewId==='settings')    r.getSettingsData();
}

function renderView(v,d) {
  if      (v==='dashboard')   renderDashboard(d);
  else if (v==='workspace')   renderWorkspace(d);
  else if (v==='cases')       renderCases(d);
  else if (v==='case360')     renderCase360(d);
  else if (v==='monitoring')  renderMonitoring(d);
  else if (v==='thirdparty')  renderThirdParty(d);
  else if (v==='projects')    renderProjects(d);
  else if (v==='performance') renderPerformance(d);
  else if (v==='settings')    renderSettings(d);
}

// ── Filter helpers ────────────────────────────────────────
function mkFsel(opts,cur,ph,onChange) {
  var h='<select class="filter-sel" onchange="'+onChange+'">';
  h+='<option value="">'+esc(ph)+': All</option>';
  opts.forEach(function(o){if(o)h+='<option value="'+esc(o)+'"'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';});
  return h+'</select>';
}
function uniq(arr) {
  var seen={},out=[];
  arr.forEach(function(v){if(v&&!seen[v]){seen[v]=true;out.push(v);}});
  return out.sort();
}
function applyFilter(view,key,val) {
  state.filters[view][key]=val;
  var d=state.data[cKey(view)];
  if(d) renderView(view,d);
}

// ── PERFORMANCE ───────────────────────────────────────────
function renderPerformance(data) {
  if(!data){setMain('<div class="error-box">No data.</div>');return;}
  var members=data.members||[];
  var tc=0,co=0,br=0;
  members.forEach(function(m){tc+=(m.totalCases||0);co+=(m.completed||0);br+=(m.breaches||0);});
  var perfH='<div class="perf-grid">'+
    pCard(tc,'Total Cases')+pCard(co,'Completed')+pCard(br,'TAT Breaches')+pCard(data.tatTarget+'d','TAT Target')+
    '</div>';
  var rows='';
  members.forEach(function(m){
    rows+='<tr><td>'+esc(m.name)+'</td><td>'+fmt(m.totalCases)+'</td><td>'+fmt(m.completed)+'</td><td>'+fmt(m.inProgress)+'</td><td>'+fmt(m.breaches)+'</td><td>'+(m.avgTat!==null?m.avgTat:'—')+'</td><td>'+(m.slaPct!==null?m.slaPct+'%':'—')+'</td></tr>';
  });
  setMain(
    '<div style="margin-bottom:20px;">'+perfH+'</div>'+
    sec('&#128200; MEMBER BREAKDOWN',
      tw('<thead><tr><th>Member</th><th>Total Cases</th><th>Completed</th><th>In Progress</th><th>Breaches</th><th>Avg TAT (days)</th><th>SLA %</th></tr></thead><tbody>'+rows+'</tbody>'))

}

// ── Modal ─────────────────────────────────────────────────
function openModal(title,bodyHtml,saveFn) {
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHtml;
  pendingSave=saveFn;
  var btn=document.getElementById('modal-save'); btn.disabled=false; btn.textContent='Save';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); pendingSave=null; }
function runSave()    { if(pendingSave) pendingSave(); }
function afterSave()  { state.data={}; closeModal(); loadView(state.view); }
function modalSaving() {
  var btn=document.getElementById('modal-save'); btn.disabled=true; btn.textContent='Saving…';
}
function modalErr(e) {
  var btn=document.getElementById('modal-save'); btn.disabled=false; btn.textContent='Save';
  alert(e.message||String(e));
}

// ── Form helpers ──────────────────────────────────────────
function frow(label,inp) { return '<div class="form-row"><label class="form-label">'+label+'</label>'+inp+'</div>'; }
function finp(id,val,type) { return '<input class="form-inp" id="'+id+'" type="'+(type||'text')+'" value="'+esc(val||'')+'" autocomplete="off">'; }
function fdate(id,val)   { return finp(id,toInputDate(val),'date'); }
function fnum(id,val,mn,mx) { return '<input class="form-inp" id="'+id+'" type="number" min="'+(mn||0)+'" max="'+(mx||100)+'" value="'+esc(String(val||''))+'" autocomplete="off">'; }
function ftxt(id,val)    { return '<textarea class="form-inp" id="'+id+'" rows="2">'+esc(val||'')+'</textarea>'; }
function fselInp(id,opts,val) {
  var h='<select class="form-inp" id="'+id+'">';
  opts.forEach(function(o){h+='<option value="'+esc(o)+'"'+(String(o)===String(val)?' selected':'')+'>'+esc(o||'— select —')+'</option>';});
  return h+'</select>';
}
function ownerFld(current) {
  if(current) return '<div class="owner-badge">'+esc(current)+'</div><input type="hidden" id="f-owner" value="'+esc(current)+'">';
  return fselInp('f-owner',[''].concat(MEMBERS),'');
}

// ── OB Case form ──────────────────────────────────────────
function newCase(owner) {
  openCaseForm(owner, null);
  var inp = document.getElementById('f-caseId');
  if (inp) {
    inp.readOnly    = true;
    inp.placeholder = 'Auto-generating…';
    inp.style.color = '#90a4ae';
    google.script.run
      .withSuccessHandler(function(id) {
        var el = document.getElementById('f-caseId');
        if (el) { el.value = id; el.readOnly = true; el.style.color = '#212121'; el.placeholder = ''; }
      })
      .withFailureHandler(function() {
        var el = document.getElementById('f-caseId');
        if (el) { el.readOnly = false; el.placeholder = 'Enter Case ID'; el.style.color = ''; }
      })
      .getNextCaseId();
  }
}
function editCase(owner,rowIndex) {
  google.script.run
    .withSuccessHandler(function(d){if(d)openCaseForm(owner,d.case);})
    .withFailureHandler(modalErr)
    .getCase360Data(owner,rowIndex);
}
function openCaseForm(owner,c) {
  var d=c||{};
  var docPctDisplay=d.docPct!==undefined ? Math.round(d.docPct*100) : '';
  var body='<div class="form-grid">'+
    '<div class="form-row span2"><label class="form-label">Owner</label>'+ownerFld(owner)+'</div>'+
    frow('Case ID',            finp('f-caseId',d.caseId))+
    frow('Vendor Name',        finp('f-vendor',d.vendor))+
    '<div class="form-row span2"><label class="form-label">Vertical</label>'+fselInp('f-vertical',VERTICALS,d.vertical)+'</div>'+
    frow('Date Initiated',     fdate('f-dateInit',d.dateInit))+
    frow('Doc % Collected (0–100)', fnum('f-docPct',docPctDisplay,0,100))+
    frow('Doc Validation Y/N', fselInp('f-docValid',YN,d.docValid))+
    frow('Doc Validation Date',fdate('f-docVDate',d.docValidDate))+
    frow('Stage 2 Y/N',        fselInp('f-stage2',YN,d.stage2))+
    frow('Stage 2 Date',       fdate('f-stage2Date',d.stage2Date))+
    frow('Stage 3 Y/N',        fselInp('f-stage3',YN,d.stage3))+
    frow('Stage 3 Date',       fdate('f-stage3Date',d.stage3Date))+
    frow('Stage 4 Y/N',        fselInp('f-stage4',YN,d.stage4))+
    frow('Stage 4 Date',       fdate('f-stage4Date',d.stage4Date))+
    frow('Decision',           finp('f-decision',d.decision))+
    frow('MOM Y/N',            fselInp('f-mom',YN,d.mom))+
    frow('MOM Date',           fdate('f-momDate',d.momDate))+
    frow('L1 Approval Y/N',    fselInp('f-l1Approval',YN,d.l1Approval))+
    frow('L1 Approval Date',   fdate('f-l1Date',d.l1Date))+
    '</div>';
  openModal((c?'Edit':'New')+' OB Case',body,function(){
    var ow=gv('f-owner');
    if(!ow){alert('Please select an owner.');return;}
    if(!gv('f-caseId')){
      var cInp=document.getElementById('f-caseId');
      alert(cInp&&cInp.readOnly?'Case ID is still being generated — please wait a moment.':'Case ID is required.');
      return;
    }
    modalSaving();
    google.script.run
      .withSuccessHandler(afterSave)
      .withFailureHandler(modalErr)
      .saveCaseData(ow,c?c.rowIndex:0,{
        caseId:gv('f-caseId'),vendor:gv('f-vendor'),vertical:gv('f-vertical'),
        dateInit:gv('f-dateInit'),docPct:gv('f-docPct'),
        docValid:gv('f-docValid'),docValidDate:gv('f-docVDate'),
        stage2:gv('f-stage2'),stage2Date:gv('f-stage2Date'),
        stage3:gv('f-stage3'),stage3Date:gv('f-stage3Date'),
        stage4:gv('f-stage4'),stage4Date:gv('f-stage4Date'),
        decision:gv('f-decision'),mom:gv('f-mom'),momDate:gv('f-momDate'),
        l1Approval:gv('f-l1Approval'),l1Date:gv('f-l1Date')
      });
  });
}

// ── Layout helpers ────────────────────────────────────────
function sec(title,content,wrap) {
  var inner=(wrap===false)?content:'<div class="table-wrap">'+content+'</div>';
  return '<div class="section"><div class="section-title">'+title+'</div>'+inner+'</div>';
}
function secBtn(title,sub,btnFn,content) {
  var btn='<button class="btn-add" onclick="'+btnFn+'">+ Add</button>';
  return '<div class="section"><div class="section-title">'+title+'<span class="st-right"><span>'+sub+'</span>'+btn+'</span></div>'+content+'</div>';
}
function tw(inner) { return '<div class="table-wrap"><table>'+inner+'</table></div>'; }
function dc(lbl,val) { return '<div class="detail-cell"><div class="dc-lbl">'+lbl+'</div><div class="dc-val">'+esc(String(fmt(val)))+'</div></div>'; }
function sumCard(val,lbl,color) { return '<div class="sum-card"><div class="sum-val" style="color:'+color+'">'+fmt(val)+'</div><div class="sum-lbl">'+lbl+'</div></div>'; }
function pCard(val,lbl) { return '<div class="perf-card"><div class="perf-val">'+fmt(val)+'</div><div class="perf-lbl">'+lbl+'</div></div>'; }
function noRec(cols) { return '<tr><td colspan="'+cols+'" style="text-align:center;color:#90a4ae;padding:16px;">No records</td></tr>'; }
