<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onboarding Operations Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #212121; min-height: 100vh; }

    .app-header { background: #1a237e; color: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .app-header h1 { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .header-meta { font-size: 11px; opacity: .75; display: flex; gap: 16px; align-items: center; }
    .refresh-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 4px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: background .15s; }
    .refresh-btn:hover { background: rgba(255,255,255,.25); }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

    .page { max-width: 1300px; margin: 0 auto; padding: 24px 20px 40px; }

    .state-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: #546e7a; font-size: 14px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #e0e0e0; border-top-color: #1a237e; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; border-radius: 8px; padding: 16px 20px; font-size: 13px; }

    .section { margin-bottom: 28px; }
    .section-title { background: #37474f; color: #fff; padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 6px 6px 0 0; letter-spacing: .5px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; border-radius: 0 0 8px 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .kpi-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 8px 14px; border-right: 1px solid rgba(255,255,255,.15); }
    .kpi-card:last-child { border-right: none; }
    .kpi-label { font-size: 10px; font-weight: 600; text-align: center; opacity: .85; line-height: 1.4; }
    .kpi-value { font-size: 32px; font-weight: 700; line-height: 1.1; margin-top: 6px; }

    .table-wrap { background: #fff; border-radius: 0 0 8px 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: #eceff1; color: #212121; padding: 8px 12px; text-align: center; font-weight: 700; font-size: 11px; border-bottom: 2px solid #b0bec5; white-space: nowrap; }
    th:first-child { text-align: left; }
    td { padding: 8px 12px; text-align: center; border-bottom: 1px solid #eceff1; color: #424242; }
    td:first-child { text-align: left; font-weight: 600; color: #1a237e; }
    tr:last-child td { border-bottom: none; }
    tr.total-row td { background: #1a237e; color: #fff; font-weight: 700; }
    tr.total-row td:first-child { color: #fff; }
    tr:not(.total-row):hover td { background: #f5f5f5; }

    .alerts-grid { display: flex; flex-direction: column; gap: 0; border-radius: 0 0 8px 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .alert-row { display: flex; align-items: center; padding: 10px 16px; gap: 14px; border-bottom: 1px solid rgba(0,0,0,.06); font-size: 12px; font-weight: 600; }
    .alert-row:last-child { border-bottom: none; }
    .alert-count { font-size: 22px; font-weight: 700; min-width: 44px; text-align: center; }
    .alert-icon { font-size: 18px; }

    .footer { text-align: center; font-size: 11px; color: #90a4ae; margin-top: 32px; padding-top: 16px; border-top: 1px solid #e0e0e0; }

    @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } table { font-size: 11px; } th, td { padding: 6px 8px; } }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>ONBOARDING OPERATIONS PLATFORM &mdash; CONTROL TOWER</h1>
    <div class="header-meta">
      <span id="updated-time"></span>
      <button class="refresh-btn" id="refresh-btn" onclick="loadData()">&#8635; Refresh</button>
    </div>
  </header>

  <main class="page">
    <div class="state-center" id="loading-state">
      <div class="spinner"></div>
      <span>Loading dashboard data&hellip;</span>
    </div>
    <div class="error-box" id="error-state" style="display:none;"></div>
    <div id="dashboard" style="display:none;"></div>
  </main>

  <script>
    var refreshTimer = null;

    function loadData() {
      var btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Loading…';
      google.script.run
        .withSuccessHandler(function(data) {
          btn.disabled = false;
          btn.textContent = '↻ Refresh';
          render(data);
          clearTimeout(refreshTimer);
          refreshTimer = setTimeout(loadData, 60000);
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = '↻ Refresh';
          showError(err.message || String(err));
        })
        .getDashboardData();
    }

    function showError(msg) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
      document.getElementById('error-state').textContent = '⚠ Could not load data: ' + msg;
      document.getElementById('dashboard').style.display = 'none';
    }

    function fmt(v) { return v !== undefined && v !== null ? v : '—'; }

    function formatTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    }

    function render(data) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'none';
      var upd = document.getElementById('updated-time');
      upd.textContent = data.refreshedAt ? 'Updated ' + formatTime(data.refreshedAt) : '';
      var dash = document.getElementById('dashboard');
      dash.style.display = 'block';
      dash.innerHTML =
        renderKPI(data.kpi) +
        renderTeam(data.members) +
        renderPipeline(data.pipeline) +
        renderAlerts(data.alerts) +
        '<div class="footer">Live view &bull; Auto-refreshes every 60 s &bull; Manager: Ajay &bull; Team: Harshita &middot; Vamsi &middot; Naveen &middot; Vishwash</div>';
    }

    function renderKPI(kpi) {
      if (!kpi) return '';
      var cards = [
        { label: 'TOTAL OB CASES',   value: kpi.totalCases,  bg: '#1a237e', fg: '#fff' },
        { label: 'OB COMPLETED',      value: kpi.completed,   bg: '#1b5e20', fg: '#fff' },
        { label: 'OB IN PROGRESS',    value: kpi.inProgress,  bg: '#0277bd', fg: '#fff' },
        { label: 'DOCS INCOMPLETE',   value: kpi.docsPending, bg: '#e65100', fg: '#fff' },
        { label: 'TAT BREACHES',      value: kpi.tatBreaches, bg: '#b71c1c', fg: '#fff' },
        { label: 'TAT TARGET (days)', value: kpi.tatTarget,   bg: '#37474f', fg: '#fff' }
      ];
      var html = '<div class="section"><div class="section-title">&#128202; LIVE KPIs</div><div class="kpi-grid">';
      cards.forEach(function(c) {
        html += '<div class="kpi-card" style="background:' + c.bg + ';color:' + c.fg + '">' +
          '<div class="kpi-label">' + c.label + '</div>' +
          '<div class="kpi-value">' + fmt(c.value) + '</div></div>';
      });
      return html + '</div></div>';
    }

    function renderTeam(members) {
      if (!members || !members.length) return '';
      var totals = { totalCases:0, completed:0, inProgress:0, docsPending:0, tatBreaches:0, monitoringOpen:0, thirdPartyOpen:0, otherTasks:0 };
      var rows = '';
      members.forEach(function(m) {
        rows += '<tr><td>' + m.name + '</td><td>' + fmt(m.totalCases) + '</td><td>' + fmt(m.completed) +
          '</td><td>' + fmt(m.inProgress) + '</td><td>' + fmt(m.docsPending) + '</td><td>' + fmt(m.tatBreaches) +
          '</td><td>' + fmt(m.monitoringOpen) + '</td><td>' + fmt(m.thirdPartyOpen) + '</td><td>' + fmt(m.otherTasks) + '</td></tr>';
        totals.totalCases     += (m.totalCases     || 0);
        totals.completed      += (m.completed      || 0);
        totals.inProgress     += (m.inProgress     || 0);
        totals.docsPending    += (m.docsPending    || 0);
        totals.tatBreaches    += (m.tatBreaches    || 0);
        totals.monitoringOpen += (m.monitoringOpen || 0);
        totals.thirdPartyOpen += (m.thirdPartyOpen || 0);
        totals.otherTasks     += (m.otherTasks     || 0);
      });
      return '<div class="section"><div class="section-title">&#128101; TEAM PERFORMANCE SUMMARY</div><div class="table-wrap"><table>' +
        '<thead><tr><th>Member</th><th>Total Cases</th><th>Completed</th><th>In Progress</th>' +
        '<th>Docs Pending</th><th>TAT Breaches</th><th>Monitoring Open</th><th>3P Open</th><th>Other Tasks</th></tr></thead>' +
        '<tbody>' + rows +
        '<tr class="total-row"><td>TEAM TOTAL</td><td>' + totals.totalCases + '</td><td>' + totals.completed +
        '</td><td>' + totals.inProgress + '</td><td>' + totals.docsPending + '</td><td>' + totals.tatBreaches +
        '</td><td>' + totals.monitoringOpen + '</td><td>' + totals.thirdPartyOpen + '</td><td>' + totals.otherTasks + '</td></tr>' +
        '</tbody></table></div></div>';
    }

    function renderPipeline(pipeline) {
      if (!pipeline || !pipeline.length) return '';
      var rows = '';
      pipeline.forEach(function(p) {
        rows += '<tr><td>' + p.name + '</td><td>' + p.owner + '</td><td>' + fmt(p.total) +
          '</td><td>' + fmt(p.inProgress) + '</td><td>' + fmt(p.completed) + '</td><td>' + fmt(p.rejected) + '</td></tr>';
      });
      return '<div class="section"><div class="section-title">&#128203; PIPELINE BY VERTICAL</div><div class="table-wrap"><table>' +
        '<thead><tr><th>Vertical</th><th>Owner</th><th>Total</th><th>In Progress</th><th>Completed</th><th>Rejected</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div></div>';
    }

    function renderAlerts(alerts) {
      if (!alerts) return '';
      var rows = [
        { bg:'#ffebee', fg:'#b71c1c', icon:'&#128680;', label:'TAT Breaches',    count: alerts.breach         },
        { bg:'#fff8e1', fg:'#e65100', icon:'&#128196;', label:'Docs Incomplete',  count: alerts.docs           },
        { bg:'#e8f5e9', fg:'#1b5e20', icon:'&#129309;', label:'Third Party Open', count: alerts.tpOpen         },
        { bg:'#fce4ec', fg:'#880e4f', icon:'&#9200;',   label:'Overdue Tasks',    count: alerts.overdue        },
        { bg:'#e3f2fd', fg:'#0d47a1', icon:'&#128065;', label:'Monitoring Open',  count: alerts.monitoringOpen }
      ];
      var html = '<div class="section"><div class="section-title">&#128680; ALERTS &nbsp;(action needed)</div><div class="alerts-grid">';
      rows.forEach(function(r) {
        html += '<div class="alert-row" style="background:' + r.bg + ';color:' + r.fg + '">' +
          '<span class="alert-icon">' + r.icon + '</span>' +
          '<span class="alert-count">' + fmt(r.count) + '</span>' +
          '<span>' + r.label + '</span></div>';
      });
      return html + '</div></div>';
    }

    window.onload = loadData;
  </script>
</body>
</html>
