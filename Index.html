<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onboarding Operations Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f7f7f5; --surface:#ffffff; --surface-2:#fbfbfa; --sidebar:#f7f7f5;
      --ink:#37352f; --ink-2:#787774; --ink-3:#9b9a97;
      --line:rgba(15,15,15,.09); --line-strong:rgba(15,15,15,.16);
      --hover:rgba(15,15,15,.045); --active:rgba(15,15,15,.08);
      --brand:#1a237e; --accent:#2a78d6;
      --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
      --tag-green-bg:#dbeddb; --tag-green-ink:#1c3829;
      --tag-red-bg:#ffe2dd;   --tag-red-ink:#5d1715;
      --tag-orange-bg:#fadec9;--tag-orange-ink:#49290e;
      --tag-blue-bg:#d3e5ef;  --tag-blue-ink:#183347;
      --tag-gray-bg:#e3e2e0;  --tag-gray-ink:#32302c;
      --tag-purple-bg:#e8deee;--tag-purple-ink:#412454;
      --shadow-sm:0 1px 2px rgba(15,15,15,.05), 0 0 0 1px var(--line);
      --shadow-md:0 5px 18px rgba(15,15,15,.10), 0 0 0 1px var(--line);
      --shadow-lg:0 16px 40px rgba(15,15,15,.16), 0 0 0 1px var(--line);
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }

    /* ── Motion ─────────────────────────────────────────── */
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn   { from { opacity: 0; transform: scale(.96) translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .main > * { animation: fadeUp .3s ease both; }
    .main > *:nth-child(2) { animation-delay: .04s; }
    .main > *:nth-child(3) { animation-delay: .08s; }
    .main > *:nth-child(4) { animation-delay: .12s; }
    .main > *:nth-child(5) { animation-delay: .16s; }
    .main > *:nth-child(6) { animation-delay: .20s; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* ── Login ──────────────────────────────────────────── */
    #login-screen { position: fixed; inset: 0; background: linear-gradient(155deg, #f7f7f5 0%, #eceef8 55%, #e2e6f6 100%); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .login-card { background: var(--surface); border-radius: 14px; padding: 38px 42px; width: min(390px, 94vw); box-shadow: var(--shadow-lg); animation: popIn .4s cubic-bezier(.16,1,.3,1); }
    .login-logo { width: 44px; height: 44px; border-radius: 10px; background: var(--brand); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .login-card h2 { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -.2px; }
    .login-sub { font-size: 12px; color: var(--ink-2); margin: 4px 0 22px; }
    .login-lbl { font-size: 10px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; display: block; margin: 12px 0 5px; }
    .login-inp { width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; padding: 9px 11px; font-size: 13px; font-family: inherit; outline: none; color: var(--ink); background: var(--surface); transition: border-color .15s, box-shadow .15s; }
    .login-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,120,214,.15); }
    #login-err { color: var(--crit); font-size: 11px; margin: 10px 0 2px; min-height: 16px; }
    #login-btn { width: 100%; background: var(--brand); color: #fff; border: none; border-radius: 7px; padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; transition: filter .15s, transform .1s; }
    #login-btn:hover { filter: brightness(1.15); }
    #login-btn:active { transform: scale(.985); }

    /* ── Header ─────────────────────────────────────────── */
    .app-header { background: var(--surface); color: var(--ink); padding: 0 18px; display: flex; align-items: center; justify-content: space-between; height: 50px; flex-shrink: 0; border-bottom: 1px solid var(--line); z-index: 50; }
    .app-header h1 { font-size: 13.5px; font-weight: 700; letter-spacing: -.1px; display: flex; align-items: center; gap: 8px; }
    .brand-cube { width: 24px; height: 24px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-chip { background: var(--hover); border-radius: 12px; padding: 3px 11px; font-size: 11px; font-weight: 600; color: var(--ink-2); }
    .user-chip:empty { display: none; }
    #updated-time { font-size: 10px; color: var(--ink-3); }
    .refresh-btn { background: transparent; border: 1px solid var(--line-strong); color: var(--ink-2); padding: 4px 11px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
    .refresh-btn:hover { background: var(--hover); color: var(--ink); }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }
    .refresh-btn.logout { color: var(--crit); border-color: rgba(208,59,59,.3); }
    .refresh-btn.logout:hover { background: rgba(208,59,59,.06); }

    /* ── Layout ─────────────────────────────────────────── */
    .body-layout { display: flex; flex: 1; overflow: hidden; }
    .main { flex: 1; overflow-y: auto; padding: 24px 28px; }

    /* ── Sidebar ────────────────────────────────────────── */
    .sidebar { width: 218px; background: var(--sidebar); border-right: 1px solid var(--line); flex-shrink: 0; display: flex; flex-direction: column; overflow-y: auto; padding-top: 6px; }
    .sidebar-user { padding: 10px 14px 12px; border-bottom: 1px solid var(--line); }
    .sidebar-user label { font-size: 9px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 5px; font-weight: 600; }
    .sidebar-user select { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); padding: 6px 9px; border-radius: 6px; font-size: 12px; font-family: inherit; cursor: pointer; font-weight: 500; }
    .nav-sec { padding: 14px 16px 4px; font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .7px; font-weight: 600; }
    .nav-item { display: flex; align-items: center; gap: 9px; margin: 1px 8px; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: background .12s, color .12s; }
    .nav-item:hover { background: var(--hover); color: var(--ink); }
    .nav-item.active { background: var(--active); color: var(--ink); font-weight: 600; }
    .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .sidebar-foot { padding: 12px 16px; font-size: 9.5px; color: var(--ink-3); border-top: 1px solid var(--line); margin-top: auto; }

    /* ── Loading / states ───────────────────────────────── */
    .state-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 10px; color: var(--ink-2); font-size: 13px; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--active); border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: var(--tag-red-bg); color: var(--tag-red-ink); border: 1px solid rgba(208,59,59,.25); border-radius: 8px; padding: 12px 16px; font-size: 12px; margin-bottom: 14px; }
    .skel { position: relative; overflow: hidden; background: var(--active); border-radius: 10px; }
    .skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: shimmer 1.1s infinite; }
    .skel-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .skel-tile { height: 96px; }
    .skel-block { height: 130px; margin-bottom: 16px; }
    .skel-block.tall { height: 280px; }

    /* ── Page & sections ────────────────────────────────── */
    .page-title { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; margin: 0 0 18px; display: flex; align-items: center; gap: 9px; }
    .section { margin-bottom: 26px; }
    .section-title { background: transparent; color: var(--ink-2); padding: 0 2px 9px; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
    .st-right { font-size: 10px; font-weight: 500; color: var(--ink-3); display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; }
    .btn-add { background: var(--brand); color: #fff; border: none; padding: 4px 12px; border-radius: 6px; font-size: 10.5px; font-weight: 600; cursor: pointer; font-family: inherit; transition: filter .15s; }
    .btn-add:hover { filter: brightness(1.2); }

    /* ── Stat tiles ─────────────────────────────────────── */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .tile { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-sm); padding: 14px 16px; transition: transform .16s ease, box-shadow .16s ease; }
    .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .tile-ico { width: 27px; height: 27px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .tile-val { font-size: 26px; font-weight: 700; color: var(--ink); margin-top: 10px; line-height: 1; letter-spacing: -.5px; }
    .tile-lbl { font-size: 9.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; margin-top: 6px; }

    /* ── Charts ─────────────────────────────────────────── */
    .chart-card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-sm); padding: 16px 18px; }
    .roll-bar { display: flex; gap: 2px; height: 14px; border-radius: 5px; overflow: hidden; background: var(--hover); }
    .roll-seg { height: 100%; border-radius: 3px; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .roll-legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; font-size: 10px; color: var(--ink-2); font-weight: 600; }
    .roll-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--ink-2); font-weight: 600; margin-top: 12px; }
    .lg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
    .hb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .hb-row:last-of-type { margin-bottom: 0; }
    .hb-name { width: 72px; font-size: 11px; font-weight: 600; color: var(--ink-2); text-align: right; flex-shrink: 0; }
    .hb-outer { flex: 1; }
    .hb-track { display: flex; gap: 2px; height: 16px; }
    .hb-seg { height: 100%; border-radius: 3px; min-width: 3px; transition: width .5s; }
    .hb-tot { width: 30px; font-size: 11px; font-weight: 700; color: var(--ink); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .pipe-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .pipe-card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-sm); padding: 14px 16px; transition: transform .16s ease, box-shadow .16s ease; }
    .pipe-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

    /* ── Kanban board ───────────────────────────────────── */
    .kb-wrap { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
    .kb-col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; min-width: 232px; flex: 1 0 232px; max-width: 320px; }
    .kb-col-head { display: flex; align-items: center; gap: 7px; padding: 10px 12px 8px; font-size: 11px; font-weight: 700; color: var(--ink-2); }
    .kb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .kb-count { margin-left: auto; background: var(--active); border-radius: 10px; padding: 1px 8px; font-size: 10px; color: var(--ink-2); font-weight: 600; }
    .kb-cards { padding: 2px 8px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 42px; }
    .kb-card { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-sm); padding: 11px 12px; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
    .kb-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .kb-title { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.35; }
    .kb-id { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
    .kb-prog { margin-top: 9px; display: flex; align-items: center; }
    .kb-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; gap: 6px; flex-wrap: wrap; }
    .kb-empty { font-size: 10px; color: var(--ink-3); text-align: center; padding: 12px 0; }
    .avatar { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; color: var(--ink-2); background: var(--hover); padding: 2px 9px 2px 6px; border-radius: 10px; white-space: nowrap; }
    .av-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Segmented control ──────────────────────────────── */
    .seg { display: inline-flex; background: var(--active); border-radius: 7px; padding: 2px; gap: 2px; }
    .seg-btn { border: none; background: transparent; font-family: inherit; font-size: 10.5px; font-weight: 600; color: var(--ink-2); padding: 4px 13px; border-radius: 5px; cursor: pointer; transition: all .15s; }
    .seg-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15,15,15,.14); }

    /* ── Tables ─────────────────────────────────────────── */
    .table-wrap { background: var(--surface); border-radius: 10px; overflow-x: auto; box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th { background: transparent; color: var(--ink-3); padding: 9px 11px; text-align: center; font-weight: 600; font-size: 9.5px; border-bottom: 1px solid var(--line); white-space: nowrap; text-transform: uppercase; letter-spacing: .5px; }
    th:first-child { text-align: left; }
    td { padding: 8px 11px; text-align: center; border-bottom: 1px solid var(--line); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
    td:first-child { text-align: left; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr.total-row td { background: var(--surface-2); color: var(--ink); font-weight: 700; border-top: 1px solid var(--line-strong); }
    tr.click-row { cursor: pointer; }
    tr.click-row:hover td, tr:not(.total-row):hover td { background: var(--hover); }
    .td-act { white-space: nowrap; }
    .btn-edit { background: none; border: 1px solid var(--line-strong); color: var(--ink-2); padding: 2px 9px; border-radius: 5px; font-size: 10px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .12s; }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Summary / perf cards ───────────────────────────── */
    .sum-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .sum-card { background: var(--surface); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-sm); transition: transform .16s, box-shadow .16s; }
    .sum-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .sum-val { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
    .sum-lbl { font-size: 9.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; }
    .perf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .perf-card { background: var(--surface); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
    .perf-val { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.4px; }
    .perf-lbl { font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; font-weight: 600; }

    /* ── Inline quick-edit pills ────────────────────────── */
    .pill-sel { appearance: none; -webkit-appearance: none; border: 1px solid var(--line-strong); border-radius: 5px; padding: 2px 18px 2px 9px; font-size: 10px; font-weight: 700; font-family: inherit; cursor: pointer; color: var(--ink-2); background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="5"><path d="M0 0l4 5 4-5z" fill="%239b9a97"/></svg>') no-repeat right 6px center; transition: all .15s; }
    .pill-sel.v-y { background-color: var(--tag-green-bg); color: var(--tag-green-ink); border-color: transparent; }
    .pill-sel.v-n { background-color: var(--tag-red-bg); color: var(--tag-red-ink); border-color: transparent; }
    .pill-sel:disabled { opacity: .5; cursor: wait; }
    .pill-date { border: 1px solid var(--line-strong); border-radius: 5px; font-size: 10px; padding: 2px 5px; font-family: inherit; color: var(--ink); background: var(--surface); }
    .pill-date:disabled { opacity: .5; }

    /* ── Toolbar & toast ────────────────────────────────── */
    .view-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .tool-btn { background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink-2); padding: 4px 11px; border-radius: 6px; font-size: 10.5px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
    .tool-btn:hover { background: var(--hover); color: var(--ink); }
    .toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 11px; font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px); transition: all .25s; z-index: 500; pointer-events: none; }
    .toast.show { opacity: 1; transform: none; }
    .toast.err { background: var(--crit); }

    /* ── Filters ────────────────────────────────────────── */
    .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .filter-lbl { font-size: 10px; color: var(--ink-3); font-weight: 600; }
    .filter-sel { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 9px; font-size: 11px; font-family: inherit; color: var(--ink); cursor: pointer; }

    /* ── Badges (Notion tags) ───────────────────────────── */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .b-green  { background: var(--tag-green-bg);  color: var(--tag-green-ink); }
    .b-red    { background: var(--tag-red-bg);    color: var(--tag-red-ink); }
    .b-orange { background: var(--tag-orange-bg); color: var(--tag-orange-ink); }
    .b-blue   { background: var(--tag-blue-bg);   color: var(--tag-blue-ink); }
    .b-gray   { background: var(--tag-gray-bg);   color: var(--tag-gray-ink); }
    .b-purple { background: var(--tag-purple-bg); color: var(--tag-purple-ink); }

    /* ── Progress bar ───────────────────────────────────── */
    .prog-wrap { background: var(--active); border-radius: 8px; height: 5px; width: 68px; display: inline-block; vertical-align: middle; }
    .prog-fill { height: 100%; border-radius: 8px; background: var(--accent); transition: width .4s; }

    /* ── Case 360 ───────────────────────────────────────── */
    .back-link { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; color: var(--ink-2); font-weight: 600; margin-bottom: 14px; padding: 4px 10px; border-radius: 6px; transition: background .12s; }
    .back-link:hover { background: var(--hover); color: var(--ink); }
    .case-hero { background: var(--surface); border-radius: 12px; padding: 18px 22px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
    .case-title { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }
    .case-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
    .case-chips { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .case-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .case-tab { padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 6px 6px 0 0; transition: all .12s; }
    .case-tab:hover { background: var(--hover); color: var(--ink); }
    .case-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .detail-cell { background: var(--surface); border-radius: 8px; padding: 11px 14px; box-shadow: var(--shadow-sm); }
    .dc-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-3); font-weight: 600; }
    .dc-val { font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 4px; }
    .workflow-step { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 8px; padding: 11px 16px; box-shadow: var(--shadow-sm); margin-bottom: 8px; transition: transform .15s, box-shadow .15s; }
    .workflow-step:hover { transform: translateX(2px); box-shadow: var(--shadow-md); }
    .ws-label { flex: 1; font-size: 12px; font-weight: 600; color: var(--ink); }
    .ws-date { font-size: 11px; color: var(--ink-3); }

    /* ── Alerts ─────────────────────────────────────────── */
    .alerts-grid { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-sm); overflow: hidden; }
    .alert-row { display: flex; align-items: center; padding: 11px 16px; gap: 12px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; }
    .alert-row:last-child { border-bottom: none; }
    .alert-count { font-size: 18px; font-weight: 700; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }

    /* ── Settings ───────────────────────────────────────── */
    .set-card { background: var(--surface); border-radius: 10px; padding: 16px 20px; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
    .set-card h3 { font-size: 10.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .set-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--ink); }
    .set-row:last-child { border-bottom: none; }
    .set-key { font-weight: 600; width: 210px; flex-shrink: 0; color: var(--ink-2); }

    /* ── Modal ──────────────────────────────────────────── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,15,15,.45); backdrop-filter: blur(2px); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; animation: fadeIn .15s ease; }
    .modal-box { background: var(--surface); border-radius: 12px; padding: 22px 24px; width: min(640px, 96vw); max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: popIn .25s cubic-bezier(.16,1,.3,1); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-head h3 { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -.2px; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-3); line-height: 1; border-radius: 5px; padding: 2px 7px; transition: background .12s; }
    .modal-close:hover { background: var(--hover); color: var(--ink); }
    .modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .btn-cancel { padding: 7px 16px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink-2); cursor: pointer; font-size: 11.5px; font-weight: 600; font-family: inherit; transition: background .12s; }
    .btn-cancel:hover { background: var(--hover); }
    .btn-save { padding: 7px 18px; border: none; border-radius: 6px; background: var(--brand); color: #fff; cursor: pointer; font-size: 11.5px; font-weight: 600; font-family: inherit; transition: filter .15s; }
    .btn-save:hover { filter: brightness(1.15); }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Forms ──────────────────────────────────────────── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .form-grid .span2 { grid-column: span 2; }
    .form-row { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 10px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; }
    .form-inp { width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; font-family: inherit; color: var(--ink); background: var(--surface); transition: border-color .15s, box-shadow .15s; }
    .form-inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,120,214,.14); }
    textarea.form-inp { resize: vertical; }
    .owner-badge { background: var(--tag-blue-bg); color: var(--tag-blue-ink); padding: 6px 11px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; }

    .footer { text-align: center; font-size: 10px; color: var(--ink-3); padding: 18px 0 4px; }

    /* ── Command palette (Ctrl/Cmd+K) ───────────────────── */
    #cmdk-overlay { position: fixed; inset: 0; background: rgba(15,15,15,.42); backdrop-filter: blur(2px); z-index: 300; display: none; align-items: flex-start; justify-content: center; padding-top: 11vh; }
    #cmdk-overlay.open { display: flex; animation: fadeIn .12s ease; }
    #cmdk { width: min(620px, 94vw); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; animation: popIn .22s cubic-bezier(.16,1,.3,1); }
    .cmdk-inp { width: 100%; border: none; outline: none; padding: 15px 18px; font-size: 14px; font-family: inherit; color: var(--ink); border-bottom: 1px solid var(--line); background: transparent; }
    .cmdk-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
    .cmdk-group { font-size: 9.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; padding: 9px 12px 4px; }
    .cmdk-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 7px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
    .cmdk-item.sel { background: var(--active); }
    .ci-ico { width: 22px; text-align: center; flex-shrink: 0; }
    .ci-sub { margin-left: auto; font-size: 10px; color: var(--ink-3); white-space: nowrap; }
    .cmdk-foot { display: flex; gap: 16px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 10px; color: var(--ink-3); }
    .cmdk-empty { padding: 22px; text-align: center; font-size: 12px; color: var(--ink-3); }
    .kbd { background: var(--active); border-radius: 4px; padding: 1px 6px; font-size: 9px; font-weight: 700; color: var(--ink-2); margin-left: 6px; }

    /* ── Sortable columns ───────────────────────────────── */
    .th-sort { cursor: pointer; user-select: none; transition: color .12s; }
    .th-sort:hover { color: var(--ink); }
    .th-arrow { font-size: 8px; margin-left: 3px; }

    /* ── Empty states ───────────────────────────────────── */
    .empty { padding: 28px 10px; text-align: center; color: var(--ink-3); font-size: 12px; font-weight: 500; }
    .empty-ico { font-size: 24px; margin-bottom: 7px; }
    .empty-sub { font-size: 10px; margin-top: 4px; }

    /* ── Needs Attention ────────────────────────────────── */
    .att-card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-sm); overflow: hidden; }
    .att-row { display: flex; align-items: center; gap: 11px; padding: 10px 15px; border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; transition: background .12s; border-left: 3px solid transparent; }
    .att-row:last-child { border-bottom: none; }
    .att-row:hover { background: var(--hover); }
    .att-row.p1 { border-left-color: var(--crit); }
    .att-row.p2 { border-left-color: var(--warn); }
    .att-row.p3 { border-left-color: var(--accent); }
    .att-lbl { font-weight: 600; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .att-clear { padding: 20px; text-align: center; font-size: 12px; color: var(--tag-green-ink); background: var(--tag-green-bg); border-radius: 10px; font-weight: 600; }

    /* ── Print / PDF ────────────────────────────────────── */
    @media print {
      body { height: auto; overflow: visible; background: #fff; }
      .app-header, .sidebar, .view-tools, .filters, .btn-add, .btn-edit, .refresh-btn, #login-screen, .modal-overlay, .footer, .td-act, .toast, .seg, #cmdk-overlay { display: none !important; }
      .body-layout { display: block; }
      .main { overflow: visible; padding: 0; }
      .main > * { animation: none !important; }
      .table-wrap, .chart-card, .tile, .kb-card { box-shadow: none; border: 1px solid #ddd; }
      .table-wrap { overflow: visible; }
      .section { break-inside: avoid; }
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 900px) {
      .sum-cards, .perf-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 16px; }
    }
    .menu { display: none; }
    @media (max-width: 600px) {
      .menu { display: inline-flex; }
      #search-btn .kbd { display: none; }
      .sidebar { position: fixed; left: 0; top: 50px; bottom: 0; z-index: 150; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-lg); }
      .sidebar.open { transform: none; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .span2 { grid-column: span 1; }
      .app-header h1 { font-size: 11px; }
    }
  </style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">&#9881;</div>
    <h2>Onboarding Operations</h2>
    <p class="login-sub">Sign in with your Recykal email</p>
    <label class="login-lbl">Email</label>
    <input id="login-email" type="email" placeholder="you@recykal.com" class="login-inp" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    <label class="login-lbl">Password</label>
    <input id="login-pass" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" class="login-inp" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-err"></div>
    <button id="login-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<header class="app-header">
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="menu-btn" class="refresh-btn menu" onclick="toggleSidebar()">&#9776;</button>
    <h1><span class="brand-cube">&#9881;</span> Onboarding Operations</h1>
  </div>
  <div class="header-right">
    <button class="refresh-btn" id="search-btn" onclick="openCmdk()">&#128269; Search<span class="kbd">Ctrl K</span></button>
    <span id="header-user" class="user-chip"></span>
    <span id="updated-time"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="onRefresh()">&#8635; Refresh</button>
    <button class="refresh-btn logout" id="logout-btn" onclick="doLogout()">Logout</button>
  </div>
</header>

<div class="body-layout">
  <nav class="sidebar">
    <div class="sidebar-user">
      <label>Viewing as</label>
      <select id="user-sel" onchange="onUserChange()">
        <option value="Ajay">Ajay</option>
        <option value="Harshita">Harshita</option>
        <option value="Vamsi">Vamsi</option>
        <option value="Naveen">Naveen</option>
        <option value="Vishwash">Vishwash</option>

    </div>
    <div class="nav-sec">Overview</div>
    <div class="nav-item nav-admin" data-v="dashboard"   onclick="navigate('dashboard')">  <span class="nav-icon">&#128202;</span> Control Tower</div>
    <div class="nav-item"          data-v="workspace"   onclick="navigate('workspace')">  <span class="nav-icon">&#128101;</span> My Workspace</div>
    <div class="nav-sec">Operations</div>
    <div class="nav-item"          data-v="cases"       onclick="navigate('cases')">      <span class="nav-icon">&#128203;</span> OB Cases</div>
    <div class="nav-item"          data-v="monitoring"  onclick="navigate('monitoring')"> <span class="nav-icon">&#128065;</span> Monitoring</div>
    <div class="nav-item"          data-v="thirdparty"  onclick="navigate('thirdparty')"> <span class="nav-icon">&#129309;</span> Third Party</div>
    <div class="nav-item"          data-v="projects"    onclick="navigate('projects')">   <span class="nav-icon">&#128196;</span> Projects</div>
    <div class="nav-sec">Insights</div>
    <div class="nav-item"          data-v="performance" onclick="navigate('performance')"><span class="nav-icon">&#128200;</span> Performance</div>
    <div class="nav-sec nav-admin">Admin</div>
    <div class="nav-item nav-admin" data-v="settings"   onclick="navigate('settings')">  <span class="nav-icon">&#9881;</span> Settings</div>
    <div class="sidebar-foot">&#9889; Auto-refresh 60 s</div>
  </nav>

  <main class="main" id="main"></main>
</div>

<!-- Command palette -->
<div id="cmdk-overlay" onclick="if(event.target===this)closeCmdk()">
  <div id="cmdk">
    <input id="cmdk-inp" class="cmdk-inp" placeholder="Search cases, tasks, records&hellip; or type a command" oninput="renderCmdk()" onkeydown="cmdkKey(event)" autocomplete="off">
    <div id="cmdk-list" class="cmdk-list"></div>
    <div class="cmdk-foot"><span><span class="kbd">&#8593;&#8595;</span> navigate</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">&#215;</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save"   id="modal-save" onclick="runSave()">Save</button>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────
var MEMBERS   = ['Harshita','Vamsi','Naveen','Vishwash'];
var VERTICALS = ['Marketplace','Open Marketplace','EPR & Sustainability'];
var YN        = ['','Y','N'];

// ── State ─────────────────────────────────────────────────
var state = {
  view:        'dashboard',
  user:        '__manager__',
  currentUser: null,
  c360:        null,
  tab360:      'overview',
  filters: {
    cases:      {owner:'',vertical:'',status:''},
    monitoring: {owner:'',status:''},
    thirdparty: {owner:'',status:''},
    projects:   {owner:'',status:''}
  },
  layout: { cases: 'table', projects: 'table' },
  sort: {},
  data: {}
};
var pendingSave = null;
var autoTimer   = null;

// ── Auth ──────────────────────────────────────────────────
function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var pass  = document.getElementById('login-pass').value.trim();
  var err   = document.getElementById('login-err');
  var btn   = document.getElementById('login-btn');
  if (!email || !pass) { err.textContent = 'Email and password are required.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';

  // Safety timeout — reset button if GAS never responds
  var loginTimer = setTimeout(function() {
    btn.disabled = false; btn.textContent = 'Sign In';
    err.textContent = 'No response from server. Ensure all GAS files are saved, then retry.';
  }, 25000);

  google.script.run
    .withSuccessHandler(function(u) {
      clearTimeout(loginTimer);
      btn.disabled = false; btn.textContent = 'Sign In';
      if (!u || !u.success) {
        err.textContent = u && u.error ? 'Server error: ' + u.error : 'Invalid email or password.';
        return;
      }
      state.currentUser = u;
      _saveSession(u);
      document.getElementById('login-screen').style.display = 'none';
      _setupForUser(u);
    })
    .withFailureHandler(function(e) {
      clearTimeout(loginTimer);
      btn.disabled = false; btn.textContent = 'Sign In';
      var msg = (e && (e.message || String(e))) || 'Login failed.';
      err.textContent = msg.indexOf('not found') > -1
        ? 'Server function missing — copy WebApp.gs to your GAS project and save.'
        : msg;
    })
    .verifyLogin(email, pass);
}

function doLogout() {
  state.currentUser = null;
  try { localStorage.removeItem('obp_session'); } catch(e) {}
  document.getElementById('header-user').textContent = '';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').textContent = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').focus();
}

function _setupForUser(u) {
  var isAdmin = u.role === 'admin';
  document.getElementById('header-user').textContent = u.name + (isAdmin ? ' (Admin)' : '');
  // Show/hide admin-only nav elements
  document.querySelectorAll('.nav-admin').forEach(function(el) {
    el.style.display = isAdmin ? '' : 'none';
  });
  // Lock user selector for members; default admins to their own sheet
  var sel = document.getElementById('user-sel');
  if (!isAdmin) {
    sel.innerHTML = '<option value="' + u.sheet + '">' + u.name + '</option>';
    sel.disabled = true;
    state.user = u.sheet;
  } else {
    sel.disabled = false;
    if (u.sheet) {
      sel.value  = u.sheet;
      state.user = u.sheet;
    } else {
      sel.value  = '__manager__';
      state.user = '__manager__';
    }
  }
  navigate(isAdmin ? 'dashboard' : 'workspace');
}

// ── Utilities ─────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(v) { return (v!==undefined&&v!==null&&v!=='') ? v : '—'; }
function pct(v) { return typeof v==='number' ? Math.round(v*100)+'%' : (v||'—'); }
function gv(id) { var e=document.getElementById(id); return e ? e.value.trim() : ''; }

function badge(v) {
  var s = String(v||'');
  if (!s||s==='—') return '<span class="badge b-gray">—</span>';
  if (s==='Completed')    return '<span class="badge b-green">'+esc(s)+'</span>';
  if (s==='Rejected')     return '<span class="badge b-gray">'+esc(s)+'</span>';
  if (s==='In Progress')  return '<span class="badge b-blue">'+esc(s)+'</span>';
  if (s==='Docs Pending'||s==='Pending Docs') return '<span class="badge b-orange">'+esc(s)+'</span>';
  if (s==='Not Started')  return '<span class="badge b-gray">'+esc(s)+'</span>';
  if (s==='Open')         return '<span class="badge b-orange">'+esc(s)+'</span>';
  if (s==='Done'||s==='Closed') return '<span class="badge b-green">'+esc(s)+'</span>';
  if (s==='Overdue')      return '<span class="badge b-red">'+esc(s)+'</span>';
  if (s==='Started')      return '<span class="badge b-blue">'+esc(s)+'</span>';
  if (s==='⚠ Breach')    return '<span class="badge b-red">'+esc(s)+'</span>';
  if (s==='On Track')     return '<span class="badge b-green">'+esc(s)+'</span>';
  if (s==='Report Received'||s==='Bill Received') return '<span class="badge b-purple">'+esc(s)+'</span>';
  return '<span class="badge b-gray">'+esc(s)+'</span>';
}

function progBar(v) {
  var p = typeof v==='number' ? Math.min(100,Math.round(v*100)) : 0;
  return '<div class="prog-wrap"><div class="prog-fill" style="width:'+p+'%"></div></div><span style="font-size:10px;margin-left:4px;">'+p+'%</span>';
}

// ── Inline quick-edit (pill dropdowns in tables) ──────────
function ynPill(section,owner,rowIndex,field,val) {
  var v=String(val||'');
  var cls=v==='Y'?' v-y':(v==='N'?' v-n':'');
  var h='<select class="pill-sel'+cls+'" onclick="event.stopPropagation()" onchange="quickSet(\''+section+'\',\''+esc(owner)+'\','+rowIndex+',\''+field+'\',this)">';
  ['','Y','N'].forEach(function(o){h+='<option value="'+o+'"'+(o===v?' selected':'')+'>'+(o||'&mdash;')+'</option>';});
  return h+'</select>';
}
function datePill(owner,rowIndex,field,val) {
  return '<input type="date" class="pill-date" value="'+toInputDate(val)+'" onclick="event.stopPropagation()" onchange="quickSet(\'task\',\''+esc(owner)+'\','+rowIndex+',\''+field+'\',this)">';
}
function quickSet(section,owner,rowIndex,field,el) {
  el.disabled=true;
  google.script.run
    .withSuccessHandler(function() {
      el.disabled=false;
      if (el.classList.contains('pill-sel')) {
        el.classList.remove('v-y','v-n');
        if (el.value==='Y') el.classList.add('v-y');
        if (el.value==='N') el.classList.add('v-n');
      }
      toast('Saved ✓');
      _bgRefresh();
    })
    .withFailureHandler(function(e) {
      el.disabled=false;
      toast((e&&e.message)||'Save failed',true);
    })
    .quickUpdateField(section,owner,rowIndex,field,el.value);
}
// Silently re-fetch the current view so auto-calculated statuses update
function _bgRefresh() {
  var viewId=state.view,k=cKey(viewId);
  var r=google.script.run.withSuccessHandler(function(d){
    state.data[k]=d; setUpdated();
    if(state.view===viewId) renderView(viewId,d);
  }).withFailureHandler(function(){});
  if      (viewId==='workspace')  r.getWorkspaceData(state.user);
  else if (viewId==='monitoring') r.getMonitoringListData();
  else if (viewId==='thirdparty') r.getThirdPartyListData();
  else if (viewId==='projects')   r.getProjectsData();
  else if (viewId==='cases')      r.getCasesListData();
  else if (viewId==='case360')    r.getCase360Data(state.c360.owner,state.c360.row);
  else if (viewId==='dashboard')  r.getDashboardData();
  else state.data[k]=null;
}

// ── Toast notifications ───────────────────────────────────
function toast(msg,isErr) {
  var t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;
  t.classList.toggle('err',!!isErr);
  t.classList.add('show');
  clearTimeout(t._h);
  t._h=setTimeout(function(){t.classList.remove('show');},2000);
}

// ── Export & print toolbar ────────────────────────────────
function viewTools(left) {
  return '<div class="view-tools">'+(left||'')+'<span style="flex:1"></span>'+
    '<button class="tool-btn" onclick="exportCsv()">&#8595; Export CSV</button>'+
    '<button class="tool-btn" onclick="window.print()">&#128424; Print / PDF</button>'+
    '</div>';
}
var CSV_COLS = {
  cases:      [['Case ID','caseId'],['Owner','owner'],['Vendor','vendor'],['Vertical','vertical'],['Date Init','dateInit'],['Doc %','docPct'],['% Done','pctDone'],['TAT Days','tatDays'],['TAT Status','tatStatus'],['Status','caseStatus']],
  monitoring: [['Owner','owner'],['Seller','seller'],['Vertical','vertical'],['Month','month'],['Data Coll','dataCollected'],['Data Date','dataDate'],['Follow-up','followUp'],['F/U Date','followUpDate'],['Outcome','outcome'],['Present Date','presentDate'],['Status','status'],['Remarks','remarks']],
  thirdparty: [['Owner','owner'],['3P Name','tpName'],['Case Ref','caseRef'],['Vertical','vertical'],['Assigned','assignedDate'],['Report','reportRcvd'],['Report Date','reportDate'],['Bill','billRcvd'],['Bill Valid','billValid'],['Bill Date','billDate'],['Status','status'],['Remarks','remarks']],
  projects:   [['Owner','owner'],['Task','description'],['Category','category'],['Assigned','dateAssigned'],['Target','targetDate'],['Actual','actualDate'],['Days Open','daysOpen'],['Status','status'],['Remarks','remarks']]
};
function exportCsv() {
  var v=state.view,d=state.data[cKey(v)];
  if(!d){toast('No data to export yet',true);return;}
  var rows=[];
  function add(arr,cols){
    rows.push(cols.map(function(c){return c[0];}));
    (arr||[]).forEach(function(r){rows.push(cols.map(function(c){var x=r[c[1]];return x===null||x===undefined?'':x;}));});
  }
  function noOwner(cols){return cols.filter(function(c){return c[1]!=='owner';});}
  if      (v==='cases')      add(d,CSV_COLS.cases);
  else if (v==='monitoring') add(d,CSV_COLS.monitoring);
  else if (v==='thirdparty') add(d,CSV_COLS.thirdparty);
  else if (v==='projects')   add(d,CSV_COLS.projects);
  else if (v==='workspace') {
    rows.push([d.member+' — Workspace export']);
    rows.push([]); rows.push(['OB CASES']);    add(d.cases,     noOwner(CSV_COLS.cases));
    rows.push([]); rows.push(['MONITORING']);  add(d.monitoring,noOwner(CSV_COLS.monitoring));
    rows.push([]); rows.push(['THIRD PARTY']); add(d.thirdParty,noOwner(CSV_COLS.thirdparty));
    rows.push([]); rows.push(['OTHER TASKS']); add(d.tasks,     noOwner(CSV_COLS.projects));
  }
  else if (v==='dashboard')   add(d.members,[['Member','name'],['Total','totalCases'],['Done','completed'],['In Progress','inProgress'],['Docs Pending','docsPending'],['TAT Breaches','tatBreaches'],['Monitoring Open','monitoringOpen'],['3P Open','thirdPartyOpen'],['Tasks','otherTasks']]);
  else if (v==='performance') add(d.members,[['Member','name'],['Total','totalCases'],['Completed','completed'],['In Progress','inProgress'],['Breaches','breaches'],['Avg TAT','avgTat'],['SLA %','slaPct']]);
  else { toast('Export not available on this view',true); return; }
  var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ob-platform-'+v+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
  toast('CSV downloaded ✓');
}

var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function toInputDate(s) {
  if (!s||s==='—') return '';
  var m = String(s).match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if (!m) return '';
  var mo = MONTHS[m[2]]; if (mo===undefined) return '';
  return m[3]+'-'+('0'+(mo+1)).slice(-2)+'-'+('0'+m[1]).slice(-2);
}

// ── Navigation ────────────────────────────────────────────
function navigate(viewId) {
  // Block restricted views for members
  if (state.currentUser && state.currentUser.role !== 'admin') {
    if (viewId === 'dashboard' || viewId === 'settings') viewId = 'workspace';
  }
  // Manager account (Ajay) has no personal sheet — redirect workspace → dashboard
  if (viewId === 'workspace' && state.user === '__manager__') viewId = 'dashboard';
  state.view = viewId;
  var sb=document.querySelector('.sidebar'); if(sb) sb.classList.remove('open');
  document.querySelectorAll('.nav-item').forEach(function(el) {
    var v = el.dataset.v;
    el.classList.toggle('active', v===viewId||(viewId==='case360'&&v==='cases'));
  });
  clearTimeout(autoTimer);
  loadView(viewId);
}

function onUserChange() {
  state.user = document.getElementById('user-sel').value;
  state.data = {};
  // If switching to manager view while on workspace, go to Control Tower instead
  if (state.user === '__manager__' && state.view === 'workspace') {
    navigate('dashboard');
  } else {
    loadView(state.view);
  }
}

function onRefresh() { state.data = {}; loadView(state.view); }

function goWorkspace(name) {
  document.getElementById('user-sel').value = name;
  state.user = name;
  state.data = {};
  navigate('workspace');
}

// ── Data loading ──────────────────────────────────────────
function cKey(v) {
  if (v==='workspace') return 'ws_'+state.user;
  if (v==='case360')   return 'c360_'+(state.c360?state.c360.owner+'_'+state.c360.row:'x');
  return v;
}

function loadView(viewId) {
  var btn = document.getElementById('refresh-btn');
  btn.disabled=true; btn.textContent='Loading…';
  var k = cKey(viewId);
  if (state.data[k]) {
    btn.disabled=false; btn.textContent='↻ Refresh';
    renderView(viewId,state.data[k]); return;
  }
  setMain(skeletonH());
  function ok(d) {
    btn.disabled=false; btn.textContent='↻ Refresh';
    state.data[k]=d; setUpdated(); renderView(viewId,d);
    clearTimeout(autoTimer);
    autoTimer=setTimeout(function(){state.data[k]=null;if(state.view===viewId)loadView(viewId);},60000);
  }
  function fail(e) {
    btn.disabled=false; btn.textContent='↻ Refresh';
    setMain('<div class="error-box">&#9888; '+esc(e.message||String(e))+'</div>'+
      '<button class="tool-btn" onclick="onRefresh()">&#8635; Retry</button>');
  }
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
  if      (viewId==='dashboard')   r.getDashboardData();
  else if (viewId==='workspace')   r.getWorkspaceData(state.user);
  else if (viewId==='cases')       r.getCasesListData();
  else if (viewId==='case360')     r.getCase360Data(state.c360.owner,state.c360.row);
  else if (viewId==='monitoring')  r.getMonitoringListData();
  else if (viewId==='thirdparty')  r.getThirdPartyListData();
  else if (viewId==='projects')    r.getProjectsData();
  else if (viewId==='performance') r.getPerformanceData();
  else if (viewId==='settings')    r.getSettingsData();
}

function renderView(v,d) {
  if      (v==='dashboard')   renderDashboard(d);
  else if (v==='workspace')   renderWorkspace(d);
  else if (v==='cases')       renderCases(d);
  else if (v==='case360')     renderCase360(d);
  else if (v==='monitoring')  renderMonitoring(d);
  else if (v==='thirdparty')  renderThirdParty(d);
  else if (v==='projects')    renderProjects(d);
  else if (v==='performance') renderPerformance(d);
  else if (v==='settings')    renderSettings(d);
}

function uniq(arr) {
  var seen={},out=[];
  arr.forEach(function(v){if(v&&!seen[v]){seen[v]=true;out.push(v);}});
  return out.sort();
}

// ── Column sorting ────────────────────────────────────────
function thRow(view, cols) {
  var s = state.sort[view]||{};
  return cols.map(function(c) {
    if (!c[1]) return '<th>'+c[0]+'</th>';
    var arrow = s.key===c[1] ? '<span class="th-arrow">'+(s.dir===1?'&#9650;':'&#9660;')+'</span>' : '';
    return '<th class="th-sort" onclick="setSort(\''+view+'\',\''+c[1]+'\')">'+c[0]+arrow+'</th>';
  }).join('');
}
function setSort(view, key) {
  var s = state.sort[view]||{ key:null, dir:1 };
  if (s.key===key) s.dir=-s.dir; else { s.key=key; s.dir=1; }
  state.sort[view]=s;
  var d=state.data[cKey(view)];
  if (d) renderView(view,d);
}
function applySort(view, arr) {
  var s=state.sort[view];
  if (!s||!s.key) return arr;
  var k=s.key, dir=s.dir;
  return arr.slice().sort(function(a,b) {
    var x=a[k], y=b[k];
    var ix=toInputDate(x), iy=toInputDate(y);
    if (ix&&iy) return ix<iy?-dir:ix>iy?dir:0;
    var nx=parseFloat(x), ny=parseFloat(y);
    if (!isNaN(nx)&&!isNaN(ny)) return (nx-ny)*dir;
    x=String(x===null||x===undefined?'':x).toLowerCase();
    y=String(y===null||y===undefined?'':y).toLowerCase();
    return x<y?-dir:x>y?dir:0;
  });
}

function cmdkRun(i) {

function cmdkKey(e) {
  if (e.key==='ArrowDown') { e.preventDefault(); if(cmdkSel<cmdkItems.length-1){cmdkSel++;_cmdkPaint();} }
  else if (e.key==='ArrowUp') { e.preventDefault(); if(cmdkSel>0){cmdkSel--;_cmdkPaint();} }
  else if (e.key==='Enter') { e.preventDefault(); cmdkRun(cmdkSel); }
  else if (e.key==='Escape') { closeCmdk(); }

    if (mn.length) groups.push({ hdr:'Monitoring', items:mn });

    if (tp.length) groups.push({ hdr:'Third Party', items:tp });
  }
  cmdkItems=[];
  var h='';
  groups.forEach(function(g) {
    h+='<div class="cmdk-group">'+g.hdr+'</div>';

// ── DASHBOARD ─────────────────────────────────────────────
function renderDashboard(data) {
  var kpi=data.kpi||{};
  function tile(ico,icoBg,v,l){return '<div class="tile"><div class="tile-ico" style="background:'+icoBg+'">'+ico+'</div><div class="tile-val">'+fmt(v)+'</div><div class="tile-lbl">'+l+'</div></div>';}
  var tilesH='<div class="tiles">'+
    tile('&#128203;','var(--tag-blue-bg)',  kpi.totalCases,'Total OB Cases')+
    tile('&#9989;',  'var(--tag-green-bg)', kpi.completed,'Completed')+
    tile('&#128260;','var(--tag-blue-bg)',  kpi.inProgress,'In Progress')+
    tile('&#128196;','var(--tag-orange-bg)',kpi.docsPending,'Docs Incomplete')+
    tile('&#128680;','var(--tag-red-bg)',   kpi.tatBreaches,'TAT Breaches')+
    tile('&#127919;','var(--tag-gray-bg)',  fmt(kpi.tatTarget)+'d','TAT Target')+
    '</div>';

  // Rollout: part-to-whole stacked bar of exclusive case statuses
  var rollH='';
  if (kpi.dist) {
    var totalN=STATUS_SEGS.reduce(function(a,s){return a+(kpi.dist[s.k]||0);},0);
    var barH='',legH='';
    STATUS_SEGS.forEach(function(s){
      var n=kpi.dist[s.k]||0;
      if(totalN>0&&n>0) barH+='<div class="roll-seg" style="width:'+(n/totalN*100)+'%;background:'+s.c+'" title="'+s.l+': '+n+'"></div>';
      legH+='<span><span class="lg-dot" style="background:'+s.c+'"></span>'+n+' '+s.l+'</span>';
    });
    rollH=sec('&#128640; ROLLOUT STATUS <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-3);margin-left:6px;">'+totalN+' cases</span>',
      '<div class="chart-card"><div class="roll-bar">'+barH+'</div><div class="legend">'+legH+'</div></div>',false);
  }

  // Cases by member — proportional stacked bars (Closed vs Open)
  var members=data.members||[];
  var maxTot=1;
  members.forEach(function(m){ if((m.totalCases||0)>maxTot) maxTot=m.totalCases; });
  var hbH='';
  members.forEach(function(m){
    var done=m.completed||0, open=Math.max(0,(m.totalCases||0)-done);
    var w=(m.totalCases||0)/maxTot*100;

function openModal(title,bodyHtml,saveFn) {

}
function closeModal() { document.getElementById('modal').classList.remove('open'); pendingSave=null; }
function runSave()    { if(pendingSave) pendingSave(); }
function afterSave()  { state.data={}; closeModal(); loadView(state.view); }
function modalSaving() {
  var btn=document.getElementById('modal-save'); btn.disabled=true; btn.textContent='Saving…';
}
function modalErr(e) {
  var btn=document.getElementById('modal-save'); btn.disabled=false; btn.textContent='Save';

// ── Stage weight auto-calculation ────────────────────────
var _STAGE_LBLS = {
  'Marketplace':          {s2:'Verification Report',              s3:'V-KYC & GST Portal Verification', s4:'Committee'},
  'Open Marketplace':     {s2:'Doc sent to 3rd Party for Verif.', s3:'Rating Report Received',          s4:'Review the Rating Report'},
  'EPR & Sustainability': {s2:'Verification Report',              s3:'V-KYC & GST Portal Verification', s4:'Committee'}
};
var _STAGE_WTS = {
  'Marketplace':          {docValid:15, stage2:30, stage3:25, stage4:20, mom:5,  l1:5},
  'Open Marketplace':     {docValid:15, stage2:15, stage3:30, stage4:30, mom:0,  l1:10},
  'EPR & Sustainability': {docValid:15, stage2:30, stage3:25, stage4:20, mom:5,  l1:5}
};
function _initCaseFormListeners() {
  _updateCaseStageUI();
  ['f-vertical','f-docValid','f-stage2','f-stage3','f-stage4','f-mom','f-l1Approval'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('change', _updateCaseStageUI);
  });
}
function _updateCaseStageUI() {
  var v  = (document.getElementById('f-vertical')||{}).value || '';
  var lb = _STAGE_LBLS[v] || {s2:'Stage 2', s3:'Stage 3', s4:'Stage 4'};
  var wt = _STAGE_WTS[v]  || {docValid:0, stage2:0, stage3:0, stage4:0, mom:0, l1:0};
  var isOMP = v === 'Open Marketplace';
  // Update stage labels
  ['stage2','stage3','stage4'].forEach(function(k, i){
    var lbl = [lb.s2, lb.s3, lb.s4][i];
    ['lbl-'+k, 'lbl-'+k+'d'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=lbl; });
  });
  // Show/hide MOM rows (not in Open Marketplace)
  ['row-mom','row-momd'].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=isOMP?'none':''; });
  // Calculate %
  function yn(id){ var el=document.getElementById(id); return el&&el.value==='Y'; }
  var pct = 0;
  if(yn('f-docValid'))               pct += wt.docValid;
  if(yn('f-stage2'))                 pct += wt.stage2;
  if(yn('f-stage3'))                 pct += wt.stage3;
  if(yn('f-stage4'))                 pct += wt.stage4;
  if(!isOMP && yn('f-mom'))          pct += wt.mom;
  if(yn('f-l1Approval'))             pct += wt.l1;
  var barClr = pct===100 ? '#1b5e20' : pct>=50 ? '#1a237e' : '#e65100';
  var inp=document.getElementById('f-docPct');    if(inp)  inp.value=pct;
  var bar=document.getElementById('case-prog-bar'); if(bar){ bar.style.width=pct+'%'; bar.style.background=barClr; }
  var lbl2=document.getElementById('case-prog-pct'); if(lbl2){ lbl2.textContent=pct+'%'; lbl2.style.color=barClr; }
}

    google.script.run
      .withSuccessHandler(afterSave)
      .withFailureHandler(modalErr)
      .saveTaskRecord(ow,t?t.rowIndex:0,{
        description:gv('f-desc'),category:gv('f-category'),
        dateAssigned:gv('f-dateAssigned'),targetDate:gv('f-targetDate'),actualDate:gv('f-actualDate'),
        remarks:gv('f-remarks')
      });
  });
}

// ── Layout helpers ────────────────────────────────────────
function sec(title,content,wrap) {
  var inner=(wrap===false)?content:'<div class="table-wrap">'+content+'</div>';
  return '<div class="section"><div class="section-title">'+title+'</div>'+inner+'</div>';
}
function secBtn(title,sub,btnFn,content) {
  var btn='<button class="btn-add" onclick="'+btnFn+'">+ Add</button>';
  return '<div class="section"><div class="section-title">'+title+'<span class="st-right"><span>'+sub+'</span>'+btn+'</span></div>'+content+'</div>';
}
function tw(inner) { return '<div class="table-wrap"><table>'+inner+'</table></div>'; }
function dc(lbl,val) { return '<div class="detail-cell"><div class="dc-lbl">'+lbl+'</div><div class="dc-val">'+esc(String(fmt(val)))+'</div></div>'; }
function sumCard(val,lbl,color) { return '<div class="sum-card"><div class="sum-val" style="color:'+color+'">'+fmt(val)+'</div><div class="sum-lbl">'+lbl+'</div></div>'; }
function pCard(val,lbl) { return '<div class="perf-card"><div class="perf-val">'+fmt(val)+'</div><div class="perf-lbl">'+lbl+'</div></div>'; }
function noRec(cols) { return '<tr><td colspan="'+cols+'"><div class="empty"><div class="empty-ico">&#128450;</div>No records yet<div class="empty-sub">Use the + Add button above to create the first one</div></div></td></tr>'; }

// ── Bootstrap ─────────────────────────────────────────────
window.onload = function() {
  try { var lay=JSON.parse(localStorage.getItem('obp_layout')||'null'); if(lay&&lay.cases) state.layout=lay; } catch(e) {}
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey||e.metaKey) && String(e.key).toLowerCase()==='k') {
      e.preventDefault();
      if (state.currentUser) openCmdk();
    } else if (e.key==='Escape') {
      closeCmdk();
      if (document.getElementById('modal').classList.contains('open')) closeModal();
    }
  });
  var u=_loadSession();
  if (u) {
    state.currentUser=u;
    document.getElementById('login-screen').style.display='none';
    _setupForUser(u);
  } else {
    document.getElementById('login-email').focus();
  }
};
</script>
